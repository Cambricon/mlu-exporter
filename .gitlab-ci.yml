image: yellow.hub.cambricon.com/caip/ci/buildpack:20250311
variables:
  GOPROXY: http://10.3.68.2:8080
  CNDEV_HEADER_URL: "http://10.3.68.83:9000/public/release/cndev/include/v6.5.24/cndev.h"
  HEADER_DEST_PATH: "${CI_PROJECT_DIR}/pkg/cndev/include/cndev.h"

.only-mr-refs: &only-mr-refs
  refs:
    - merge_requests
    - master

.get-header: &get-header
  before_script:
    - |
      echo "Downloading cndev.h from file server..."
      cd "${CI_PROJECT_DIR}"
      echo "Working in: $(pwd)"
      mkdir -p pkg/cndev/include
      if wget -q "${CNDEV_HEADER_URL}" -O "${HEADER_DEST_PATH}"; then
        echo "✓ Successfully downloaded cndev.h"
      else
        echo "✗ Failed to download cndev.h"
        exit 1
      fi

stages:
  - precheckin
  - lint
  - build
  - test

run-sensitive-word-check:
  stage: precheckin
  image:
    name: yellow.hub.cambricon.com/toolrd/sensitive-word-detector-local:2.0.0
    entrypoint: [""]
  script:
    - |
      set -e
      WORKSPACE=${CI_PROJECT_DIR}
      OUTPUT_DIR=${WORKSPACE}/sensitive_check
      rm -rf "${OUTPUT_DIR}"
      mkdir -p "${OUTPUT_DIR}"

      # 修复敏感词检测工具的字典路径问题
      # 工具在 /go/pkg/mod/... 查找字典，但实际文件在 /usr/local/bin/dict/
      DICT_SRC="/usr/local/bin/dict"
      DICT_DST="/go/pkg/mod/github.com/yanyiwu/gojieba@v1.4.6/deps/cppjieba/dict"
      mkdir -p "${DICT_DST}"
      cp -n "${DICT_SRC}"/*.utf8 "${DICT_DST}"/ 2>/dev/null || true

      FAILED=0

      # 检查 docs 目录下的 rst 文件
      if [ -d "${WORKSPACE}/${SUBDIR}/docs" ]; then
        echo "Checking docs/..."
        for rst_file in $(find "${WORKSPACE}/docs" -type f \( -name "*.rst" -o -name "*.md" \)); do
          file_name=$(basename "${rst_file}" | sed 's/\./_/g')
          sensitive-filter -P "${rst_file}" -o "${OUTPUT_DIR}" --filename "docs_${file_name}"
          if grep -q "红灯" "${OUTPUT_DIR}/docs_${file_name}.csv"; then
            echo "ERROR: Sensitive word '红灯' found in ${rst_file}"
            cat "${OUTPUT_DIR}/docs_${file_name}.csv"
            FAILED=1
          fi
        done
      fi

      # 检查 README.md
      echo "Checking README.md..."
      sensitive-filter -P "${WORKSPACE}/README.md" -o "${OUTPUT_DIR}" --filename "readme"
      if grep -q "红灯" "${OUTPUT_DIR}/readme.csv"; then
        echo "ERROR: Sensitive word '红灯' found in README.md"
        cat "${OUTPUT_DIR}/readme.csv"
        FAILED=1
      fi

      # 检查 CHANGELOG.md
      echo "Checking CHANGELOG.md..."
      sensitive-filter -P "${WORKSPACE}/CHANGELOG.md" -o "${OUTPUT_DIR}" --filename "changelog"
      if grep -q "红灯" "${OUTPUT_DIR}/changelog.csv"; then
        echo "ERROR: Sensitive word '红灯' found in CHANGELOG.md"
        cat "${OUTPUT_DIR}/changelog.csv"
        FAILED=1
      fi

      # 检查代码目录 (pkg, main.go, Makefile, shell scripts)，排除 cndev.h
      echo "Checking source code..."
      find "${WORKSPACE}/pkg" -type f ! -name "cndev.h" -exec sensitive-filter -P {} -o "${OUTPUT_DIR}" --filename "pkg" \;
      if grep -q "红灯" "${OUTPUT_DIR}/pkg.csv"; then
        echo "ERROR: Sensitive word '红灯' found in pkg/"
        cat "${OUTPUT_DIR}/pkg.csv"
        FAILED=1
      fi

      sensitive-filter -P "${WORKSPACE}/main.go" -o "${OUTPUT_DIR}" --filename "main"
      if grep -q "红灯" "${OUTPUT_DIR}/main.csv"; then
        echo "ERROR: Sensitive word '红灯' found in main.go"
        cat "${OUTPUT_DIR}/main.csv"
        FAILED=1
      fi

      sensitive-filter -P "${WORKSPACE}/Makefile" -o "${OUTPUT_DIR}" --filename "makefile"
      if grep -q "红灯" "${OUTPUT_DIR}/makefile.csv"; then
        echo "ERROR: Sensitive word '红灯' found in Makefile"
        cat "${OUTPUT_DIR}/makefile.csv"
        FAILED=1
      fi

      # 检查 shell 脚本
      for sh_file in $(find "${WORKSPACE}" -name '*.sh' -type f); do
        echo "Checking ${sh_file}..."
        file_name=$(basename "${sh_file}" .sh)
        sensitive-filter -P "${sh_file}" -o "${OUTPUT_DIR}" --filename "sh_${file_name}"
        if grep -q "红灯" "${OUTPUT_DIR}/sh_${file_name}.csv"; then
          echo "ERROR: Sensitive word '红灯' found in ${sh_file}"
          cat "${OUTPUT_DIR}/sh_${file_name}.csv"
          FAILED=1
        fi
      done

      if [ "${FAILED}" -eq 1 ]; then
        echo "Sensitive word check FAILED."
        exit 1
      fi

      echo "Sensitive word check passed."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

run-shellcheck-lint:
  stage: lint
  extends: .get-header
  image: 10.3.68.2:5001/cambricon/shellcheck-alpine:v0.7.0
  script:
    - find . -name '*.sh' -exec shellcheck {} +
  only:
    changes:
      - .gitlab-ci.yml
      - "**/*.sh"
    <<: *only-mr-refs

run-mlu-exporter-lint:
  stage: lint
  extends: .get-header
  script:
    - make lint
  only:
    <<: *only-mr-refs

run-mlu-exporter-build:
  stage: build
  extends: .get-header
  script:
    - make build
  only:
    <<: *only-mr-refs

run-mlu-exporter-test:
  stage: test
  extends: .get-header
  script:
    - make test
  only:
    <<: *only-mr-refs
